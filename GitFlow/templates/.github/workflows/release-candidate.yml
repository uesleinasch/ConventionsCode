name: release-candidate

on:
  push:
    branches: ['release/v*']

permissions:
  contents: read

concurrency:
  group: rc-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  tag-rc:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v1
        id: app
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      - name: Criar tag de release candidate
        env:
          BRANCH: ${{ github.ref_name }}
          BOT_NAME: ${{ steps.app.outputs.app-slug }}[bot]
          BOT_EMAIL: ${{ vars.RELEASE_BOT_EMAIL }}
        run: |
          version="${BRANCH#release/}"

          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Nome de branch de release inválido: $BRANCH"
            exit 1
          fi

          if git tag --points-at HEAD | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'; then
            echo "HEAD já possui tag de versão; nada a fazer."
            exit 0
          fi

          n=$(git tag -l "${version}-rc.*" | wc -l)
          tag="${version}-rc.$((n + 1))"

          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          git tag -a "$tag" -m "Release candidate $tag"
          git push origin "refs/tags/$tag"
          echo "### $tag criada" >> "$GITHUB_STEP_SUMMARY"
