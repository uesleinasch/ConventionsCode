name: promote

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão a promover para produção (ex.: v1.4.0)'
        required: true

permissions:
  contents: read

concurrency:
  group: release-management
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: release-approval
    steps:
      - uses: actions/create-github-app-token@v1
        id: app
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      - name: Validar e promover
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BOT_NAME: ${{ steps.app.outputs.app-slug }}[bot]
          BOT_EMAIL: ${{ vars.RELEASE_BOT_EMAIL }}
        run: |
          fail() { echo "::error::$1"; exit 1; }

          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "Versão inválida: $VERSION"
          git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null && fail "Tag $VERSION já existe."

          branch="origin/release/$VERSION"
          git rev-parse -q --verify "$branch" >/dev/null || fail "Branch release/$VERSION não encontrada."
          head=$(git rev-parse "$branch")

          rc=$(git tag -l "$VERSION-rc.*" --sort=-v:refname | head -n1)
          [ -n "$rc" ] || fail "Nenhum release candidate para $VERSION."
          [ "$(git rev-list -n1 "$rc")" = "$head" ] || fail "HEAD de release/$VERSION não corresponde ao último RC ($rc). Aguarde o novo RC."
          gh release view "$rc" >/dev/null 2>&1 || fail "Pre-release $rc não encontrado (build do RC falhou ou não terminou)."

          git merge-base --is-ancestor origin/production "$head" \
            || fail "production não é ancestral de release/$VERSION. Faça o back-merge/cherry-pick do último hotfix."

          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          git tag -a "$VERSION" "$head" -m "Release $VERSION (promovida de $rc)"
          git push --atomic origin "$head:refs/heads/production" "refs/tags/$VERSION"

          echo "### $VERSION promovida de $rc ($(git rev-parse --short "$head"))" >> "$GITHUB_STEP_SUMMARY"
