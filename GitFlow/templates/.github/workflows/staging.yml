name: staging

on:
  push:
    branches: [staging]

permissions:
  contents: read

concurrency:
  group: staging
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Gerar pacote
        env:
          SHA: ${{ github.sha }}
        run: make package VERSION="staging-${SHA::7}"

      - run: ./scripts/deploy.sh staging dist/
