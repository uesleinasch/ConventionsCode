name: cut-release

on:
  workflow_dispatch:
    inputs:
      kind:
        description: 'regular (a partir de main) ou hotfix (a partir de production)'
        type: choice
        options: [regular, hotfix]
        default: regular

permissions:
  contents: read

concurrency:
  group: release-management
  cancel-in-progress: false

jobs:
  cut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v1
        id: app
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.kind == 'hotfix' && 'production' || 'main' }}
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Calcular versão e criar branch de release
        env:
          KIND: ${{ inputs.kind }}
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-rc.*' 2>/dev/null || echo "v0.0.0")

          if [ "$KIND" = "hotfix" ]; then
            IFS=. read -r major minor patch <<< "${last#v}"
            next="v${major}.${minor}.$((patch + 1))"
          else
            next=$(git cliff --bumped-version)
          fi

          if [ "$next" = "$last" ]; then
            echo "::error::Nenhum commit relevante desde $last."
            exit 1
          fi

          if git ls-remote --exit-code --heads origin "release/$next" >/dev/null; then
            echo "::error::release/$next já existe."
            exit 1
          fi

          git push origin "HEAD:refs/heads/release/$next"
          echo "### release/$next criada a partir de $(git rev-parse --short HEAD) (última versão: $last)" >> "$GITHUB_STEP_SUMMARY"
